[package]
name = "daily-canvas-desktop"
version = "0.7.0"
description = "Daily Canvas desktop shell (M8 feasibility spike)"
edition = "2021"
publish = false

[lib]
name = "daily_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-http = "2.6.1"
tauri-plugin-opener = "2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
