<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Daily Canvas — Full-Product Manual QA</title>
  <style>
    :root{--bg:#f3f0ea;--paper:#fffdf8;--ink:#24231f;--muted:#666157;--line:#d9d2c5;--accent:#b75c3b;--accent2:#2f756e;--good:#24734f;--bad:#a43434;--warn:#986416;--soft:#eee8dc;--shadow:0 14px 38px rgba(52,42,28,.10);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(130deg,#ece6dc,#f8f5ef 48%,#e9f0ed);color:var(--ink);line-height:1.55}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
    .shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;background:#282a27;color:#faf7ef;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#d77d52,#a54331);font-weight:800}.brand h1{font-size:1rem;margin:0}.brand p{font-size:.78rem;color:#c9c7c0;margin:2px 0 0}.side-progress{padding:13px;background:#353734;border-radius:12px;margin-bottom:16px}.progress-track{height:8px;border-radius:999px;background:#545652;overflow:hidden}.progress-track i{display:block;height:100%;background:#e7a579;width:0}.side-progress strong{display:block;margin-top:8px}.nav{display:grid;gap:4px}.nav a{display:flex;justify-content:space-between;gap:8px;color:#e7e3db;text-decoration:none;padding:9px 10px;border-radius:8px;font-size:.86rem}.nav a:hover,.nav a:focus-visible{background:#40423e}.nav small{color:#aaa89f}.privacy{font-size:.75rem;color:#aaa89f;margin-top:24px}
    main{min-width:0;padding:30px clamp(18px,4vw,54px) 80px}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 0;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}.btn{border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:9px;font-weight:650}.btn:hover,.btn:focus-visible{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}.lang-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.lang-switch button{border:0;background:var(--paper);padding:8px 12px}.lang-switch button.active{background:#2f756e;color:white}
    .hero,.module,.meta-card,.summary-card{background:rgba(255,253,248,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px}.hero{padding:clamp(24px,5vw,52px);margin-bottom:22px}.kicker{color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.76rem}.hero h2{font-family:Georgia,serif;font-size:clamp(2rem,5vw,4.3rem);line-height:1.03;margin:.18em 0}.hero p{max-width:820px;color:var(--muted);font-size:1.05rem}.notice{padding:14px 16px;border-left:4px solid var(--warn);background:#fff4d9;border-radius:8px;color:#604719}.meta-card,.summary-card{padding:22px;margin-bottom:22px}.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field span{font-size:.8rem;font-weight:750;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(47,117,110,.28);outline-offset:2px}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.stat{padding:13px;border-radius:12px;background:var(--soft)}.stat strong{display:block;font-size:1.45rem}.stat small{color:var(--muted)}.module{margin:22px 0;scroll-margin-top:70px;overflow:hidden}.module-head{padding:24px;border-bottom:1px solid var(--line);display:flex;gap:16px;justify-content:space-between}.module-head h2{margin:0;font-family:Georgia,serif;font-size:1.65rem}.module-head p{margin:6px 0 0;color:var(--muted);max-width:800px}.module-badge{white-space:nowrap;background:var(--soft);padding:7px 10px;border-radius:999px;height:max-content;font-size:.8rem}.module-guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px 24px;background:#faf7f0;border-bottom:1px solid var(--line)}.module-guide h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 5px;color:var(--accent2)}.module-guide p,.module-guide ol{font-size:.86rem;color:var(--muted);margin:0;padding-left:18px}.module-guide p{padding-left:0}
    .check{padding:24px;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.check-title{display:flex;gap:12px;align-items:flex-start}.check-id{font:700 .77rem ui-monospace,monospace;color:var(--accent);background:#f7e7df;padding:4px 7px;border-radius:6px}.check h3{margin:0;font-size:1.06rem}.expected{margin:11px 0;padding:11px 13px;background:#edf5f1;border-left:3px solid var(--accent2);border-radius:6px}.expected strong{display:block;font-size:.76rem;text-transform:uppercase;color:var(--accent2)}.status-row{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.status-row label{position:relative}.status-row input{position:absolute;opacity:0;pointer-events:none}.status-row span{display:block;border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:.82rem}.status-row input:checked+span{border-color:currentColor;background:#282a27;color:#fff}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.severity{max-width:260px}.save-state{margin-right:auto;align-self:center;color:var(--muted);font-size:.82rem}.save-state.error{color:var(--bad)}.overall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.footer{color:var(--muted);text-align:center;padding-top:24px}
    .toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#262824;color:#fff;border-radius:10px;box-shadow:var(--shadow);z-index:10}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:980px){.shell{display:block}.sidebar{position:relative;height:auto}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,1fr)}.module-guide{grid-template-columns:1fr}.toolbar{top:0}.privacy{margin-bottom:0}}
    @media(max-width:620px){main{padding:16px 12px 60px}.meta-grid,.details-grid,.overall-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.module-head{display:block}.module-badge{display:inline-block;margin-top:10px}.toolbar{justify-content:flex-start}.save-state{width:100%;order:-1}.nav{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    @media print{body{background:white}.shell{display:block}.sidebar,.toolbar,.notice .interactive-only{display:none!important}main{padding:0}.hero,.module,.meta-card,.summary-card{box-shadow:none;border-color:#bbb;break-inside:avoid}.module{break-before:page}.check{break-inside:avoid}.module-guide{background:white}.status-row input:not(:checked)+span{display:none}.status-row input:checked+span{display:block;border:1px solid #333;background:white;color:#000}.details-grid{display:block}.details-grid label{display:block;margin:8px 0}textarea{min-height:60px;border-color:#bbb;overflow:visible}.toast{display:none}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">DC</span><div><h1>Daily Canvas</h1><p data-t="sideTitle"></p></div></div>
    <div class="side-progress"><div class="progress-track"><i id="sideBar"></i></div><strong id="sidePercent">0%</strong><small data-t="completion"></small></div>
    <nav class="nav" id="nav" aria-label="QA modules"></nav>
    <p class="privacy" data-t="privacyShort"></p>
  </aside>
  <main>
    <div class="toolbar">
      <span id="saveState" class="save-state" role="status"></span>
      <div class="lang-switch" aria-label="Language"><button id="langEn" type="button">English</button><button id="langZh" type="button">中文</button></div>
      <button class="btn" id="exportJson" type="button" data-t="exportJson"></button>
      <button class="btn" id="importJson" type="button" data-t="importJson"></button>
      <button class="btn" id="exportMd" type="button" data-t="exportMarkdown"></button>
      <button class="btn" id="print" type="button" data-t="print"></button>
      <button class="btn danger" id="reset" type="button" data-t="reset"></button>
      <input class="hidden" id="importFile" type="file" accept="application/json">
    </div>
    <header class="hero">
      <span class="kicker">Retrospective Full-Product QA Baseline</span>
      <h2 data-t="title"></h2>
      <p data-t="intro"></p>
      <div class="notice"><strong data-t="privacyTitle"></strong> <span data-t="privacyBody"></span></div>
    </header>
    <section class="meta-card" aria-labelledby="metaHeading">
      <h2 id="metaHeading" data-t="session"></h2>
      <div class="meta-grid">
        <label class="field"><span data-t="appVersion"></span><input data-meta="appVersion" placeholder="0.7.0 / commit"></label>
        <label class="field"><span data-t="reviewDate"></span><input data-meta="reviewDate" type="date"></label>
        <label class="field"><span data-t="testerCode"></span><input data-meta="testerCode" maxlength="40" placeholder="QA-01"></label>
        <label class="field"><span data-t="environment"></span><input data-meta="environment" maxlength="160" placeholder="Windows 11 · Browser version · local dev"></label>
      </div>
    </section>
    <section class="summary-card" aria-labelledby="summaryHeading">
      <h2 id="summaryHeading" data-t="progress"></h2>
      <div class="stats" id="stats"></div>
    </section>
    <div id="modules"></div>
    <section class="summary-card" id="overall">
      <h2 data-t="overall"></h2>
      <div class="overall-grid">
        <label class="field"><span data-t="mostMature"></span><textarea data-overall="mostMature"></textarea></label>
        <label class="field"><span data-t="mostConfusing"></span><textarea data-overall="mostConfusing"></textarea></label>
        <label class="field"><span data-t="mostEffort"></span><textarea data-overall="mostEffort"></textarea></label>
        <label class="field"><span data-t="trustIssues"></span><textarea data-overall="trustIssues"></textarea></label>
        <label class="field"><span data-t="topThree"></span><textarea data-overall="topThree"></textarea></label>
        <label class="field"><span data-t="releaseBlockers"></span><textarea data-overall="releaseBlockers"></textarea></label>
        <label class="field"><span data-t="releaseDecision"></span><select data-overall="releaseDecision"><option value=""></option><option value="ready" data-t="ready"></option><option value="ready-with-followups" data-t="readyFollowups"></option><option value="not-ready" data-t="notReady"></option></select></label>
        <label class="field"><span data-t="otherFeedback"></span><textarea data-overall="otherFeedback"></textarea></label>
      </div>
    </section>
    <p class="footer">Daily Canvas Manual QA · Questionnaire 1.0.0 · Schema 1</p>
  </main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>

rted",importBad:"Import rejected: incompatible or malformed QA result",resetOne:"Clear every answer in this questionnaire?",resetTwo:"This cannot be undone unless you exported JSON. Clear now?",resetDone:"Questionnaire reset",downloaded:"Download created",moduleCount:"{{done}} / {{total}} reviewed"},
  zh:{sideTitle:"全产品人工验收",completion:"已完成",privacyShort:"仅在本地自动保存。请使用测试代号，不要填写真实身份。",title:"全产品人工核查问卷",intro:"针对 Daily Canvas v0.7 的真实用户旅程、数据安全、跨模块证据、恢复能力、可访问性与发布准备度进行人工审查。自动化测试只是辅助证据，不能替代这里的人工观察。",privacyTitle:"隐私提醒：",privacyBody:"只使用合成或可丢弃数据。不要填写真实回顾、感悟、姓名、邮箱、本地路径、凭据或其他个人信息。",session:"测试会话",appVersion:"应用版本 / commit",reviewDate:"核查日期",testerCode:"测试者代号（不是真实身份）",environment:"操作系统、浏览器与运行方式",progress:"完成进度",overall:"总体评价",exportJson:"导出 JSON",importJson:"导入 JSON",exportMarkdown:"导出 Markdown",print:"打印 / 保存 PDF",reset:"重置",saved:"已在本地保存",saving:"正在保存…",storageError:"本地自动保存不可用——请立即导出 JSON",notSaved:"尚未保存",purpose:"目的",prerequisites:"前置条件",samples:"使用样本",steps:"模块执行方法",expected:"预期结果",actual:"实际表现 / 备注",repro:"复现步骤",evidence:"证据或附件文件名",suggestion:"改进建议",severity:"严重程度 / 影响",notTested:"未测试",pass:"通过",fail:"失败",blocked:"阻塞",notApplicable:"不适用",none:"无",low:"低",medium:"中",high:"高",critical:"发布阻断",mostMature:"最成熟的模块及原因",mostConfusing:"最困惑的术语、控件或提示",mostEffort:"最费力的工作流",trustIssues:"降低信任的行为",topThree:"最希望优先改进的三项",releaseBlockers:"已知发布阻断项",releaseDecision:"Feature Complete Gate 建议",ready:"可以通过",readyFollowups:"可通过，但需 Hardening 跟进",notReady:"尚不可通过",otherFeedback:"其他反馈",importOk:"已导入兼容结果",importBad:"导入被拒绝：QA 结果不兼容或已损坏",resetOne:"清空本问卷中的所有答案？",resetTwo:"如果没有导出 JSON，此操作无法撤销。确定清空？",resetDone:"问卷已重置",downloaded:"已生成下载文件",moduleCount:"已核查 {{done}} / {{total}}"}};
const modules=[
{id:"00",en:"Startup, onboarding, and local boundary",zh:"启动、初始引导与本地边界",purpose:{en:"Confirm the supported launch path, first-run choices, English-first behavior, and local-only product boundary.",zh:"确认受支持的启动方式、首次使用选择、英文优先行为与本地产品边界。"},pre:{en:"A clean browser origin plus the normal launcher or development command.",zh:"干净的浏览器来源，以及正常启动器或开发命令。"},samples:{en:"No sample required.",zh:"无需样本。"},steps:{en:["Start through the supported launcher or dev command.","Complete onboarding once with templates and once without if a disposable origin is available.","Reload and inspect retained settings."],zh:["通过受支持的启动器或开发命令启动。","在可丢弃来源中分别尝试带模板和不带模板完成引导。","刷新并检查设置是否保留。"]}},
{id:"01",en:"Areas, tasks, and schedule creation",zh:"领域、任务与计划创建",purpose:{en:"Verify safe creation and editing across the product's planning models.",zh:"核对产品各类计划模型的创建与编辑安全性。"},pre:{en:"Onboarding complete; start with disposable records.",zh:"已完成引导；使用可丢弃记录。"},samples:{en:"Create records through the UI.",zh:"通过界面创建记录。"},steps:{en:["Create two Areas.","Create fixed, Floating, and Quota records with distinct types.","Edit, star, filter, archive, restore, and delete synthetic records."],zh:["创建两个领域。","分别创建固定、浮动和配额记录。","编辑、加星、筛选、归档、恢复并删除合成记录。"]}},
{id:"02",en:"Today and daily completion flow",zh:"今日与每日完成流程",purpose:{en:"Validate due-item selection, compassionate status language, ordering, and immediate persistence.",zh:"验证当日项目选择、温和状态措辞、排序与即时持久化。"},pre:{en:"Several fixed habits and tasks due today, including an avoidance habit.",zh:"今天有多个固定习惯和任务，其中包含一个避免型习惯。"},samples:{en:"UI-created records; normal v6 sample for historical comparisons.",zh:"界面创建记录；历史对比可使用正常 v6 样本。"},steps:{en:["Record done, safe, lapse, and skipped states.","Reorder Today cards with pointer and keyboard.","Reload and compare state and order."],zh:["记录完成、安全、失误和跳过状态。","分别用指针和键盘调整今日卡片顺序。","刷新并核对状态与顺序。"]}},

{id:"04",en:"Calendar evidence and editable history",zh:"日历证据与可编辑历史",purpose:{en:"Verify visible, filterable source evidence including inactive lifecycle records.",zh:"验证可见、可筛选的来源证据，包括非活动生命周期记录。"},pre:{en:"Restore the normal v6 sample in a disposable origin and navigate to June/July 2026.",zh:"在可丢弃来源恢复正常 v6 样本，并进入 2026 年 6 月和 7 月。"},samples:{en:"daily-canvas-v6-normal.json",zh:"daily-canvas-v6-normal.json"},steps:{en:["Use aggregate, task, and Area modes.","Apply each record-type filter separately.","Open evidence dates and edit a past check-in."],zh:["使用汇总、单任务和单领域模式。","分别应用每一种记录类型筛选。","打开证据日期并编辑过去打卡。"]}},

{id:"06",en:"Reflection, emotion, experience, and backgrounds",zh:"回顾、情绪、体验与背景",purpose:{en:"Validate private writing, optional prompts, micro-reflections, and locally stored appearance assets.",zh:"验证私人书写、可选提示、微型体验记录与本地背景资源。"},pre:{en:"A disposable task and a small authorized nonprivate JPEG, PNG, or WebP.",zh:"一个可丢弃任务，以及有权使用的小型非私人 JPEG、PNG 或 WebP。"},samples:{en:"Use your own authorized nonprivate image; no repository image is supplied.",zh:"使用自己有权使用的非私人图片；仓库不提供图片样本。"},steps:{en:["Write and edit one dated Reflection with multiple emotions and paragraphs.","Save an optional Experience Log after check-in.","Assign, adjust, replace, and clear a background."],zh:["写入并编辑一篇带多种情绪和多段文字的日期回顾。","打卡后保存可选体验记录。","设置、调整、替换并清除背景。"]}},
{id:"07",en:"Lifecycle, pauses, milestones, and rewards",zh:"生命周期、暂停、里程碑与奖励",purpose:{en:"Verify neutral pause semantics, durable milestone continuation, recovery choices, and retained history.",zh:"验证中性的暂停语义、持久的里程碑继续逻辑、恢复选择与历史保留。"},pre:{en:"Habits with short synthetic milestones; normal v6 sample supplies paused and acknowledged states.",zh:"带短期合成里程碑的习惯；正常 v6 样本提供暂停与已确认状态。"},samples:{en:"daily-canvas-v6-normal.json",zh:"daily-canvas-v6-normal.json"},steps:{en:["Reach and acknowledge a short milestone.","Continue and add another completion.","Create and resume planned and dated pauses; inspect events and rewards."],zh:["达到并确认一个短里程碑。","选择继续并再添加一次完成。","创建并恢复计划暂停和有结束日期的暂停；检查事件与奖励。"]}},
{id:"08",en:"Meditations and personal collection export",zh:"感悟与个人合集导出",purpose:{en:"Validate the independent short-writing collection, order, selection, print/PDF rules, and editable Word output.",zh:"验证独立短文合集、排序、选择、打印/PDF 规则与可编辑 Word 输出。"},pre:{en:"At least three synthetic Meditations, including mixed Chinese and English.",zh:"至少三条合成感悟，其中包含中英文混合内容。"},samples:{en:"The normal v6 sample contains two entries; create one more in the UI.",zh:"正常 v6 样本包含两条；再通过界面创建一条。"},steps:{en:["Create, edit, reorder, select, and delete synthetic entries.","Preview all and selected exports.","Change cover, dates, paper, text size, background; test print and Word."],zh:["创建、编辑、排序、选择并删除合成条目。","预览全部和部分导出。","更改封面、日期、纸张、字号和背景；测试打印与 Word。"]}},
{id:"09",en:"Backup, migration, restore, and rejection",zh:"备份、迁移、恢复与拒绝",purpose:{en:"Confirm recoverability without silent overwrite or acceptance of incompatible data.",zh:"确认数据可恢复，同时不会静默覆盖或接受不兼容数据。"},pre:{en:"Disposable origin. Export any data you care about first.",zh:"可丢弃来源。先导出任何需要保留的数据。"},samples:{en:"All four JSON files in samples/.",zh:"samples/ 中的四个 JSON 文件。"},steps:{en:["Export a current backup.","Preview and restore the normal v6 sample, then the v5 sample.","Attempt both invalid imports and confirm existing data remains."],zh:["导出当前备份。","预览并恢复正常 v6 样本，再恢复 v5 样本。","尝试两个无效导入，并确认现有数据保持不变。"]}},
{id:"10",en:"Privacy, accessibility, responsive use, and stability",zh:"隐私、可访问性、响应式与稳定性",purpose:{en:"Assess release-level qualities that automated unit tests cannot establish alone.",zh:"评估仅靠自动化单元测试无法确认的发布级质量。"},pre:{en:"Desktop browser, keyboard, narrow viewport, and optional browser developer tools.",zh:"桌面浏览器、键盘、窄视口，以及可选的浏览器开发者工具。"},samples:{en:"Synthetic records only.",zh:"仅使用合成记录。"},steps:{en:["Navigate without a mouse and switch language/theme/reduced motion.","Resize to a narrow viewport and inspect focus and overflow.","Use offline mode, reload, and inspect for remote requests or data loss."],zh:["不使用鼠标导航，并切换语言、主题和减少动效。","缩小视口，检查焦点与溢出。","使用离线模式并刷新，检查远程请求或数据丢失。"]}},
{id:"11",en:"Release judgment and long-session confidence",zh:"发布判断与长会话信心",purpose:{en:"Capture cross-product consistency, performance observations, and explicit gate recommendations.",zh:"记录跨产品一致性、性能观察与明确的门禁建议。"},pre:{en:"Complete the applicable modules above.",zh:"完成上述适用模块。"},samples:{en:"Normal v6 sample plus records created during this review.",zh:"正常 v6 样本，以及本次核查过程中创建的记录。"},steps:{en:["Move repeatedly across all top-level views.","Perform a sustained mixed workflow and reload.","Record blockers, trust issues, and the gate recommendation below."],zh:["反复切换所有顶层页面。","执行一段持续的混合工作流并刷新。","在下方记录阻断项、信任问题和门禁建议。"]}}
];
const item=(id,m,en,zh,een,ezh)=>({id,module:m,title:{en,zh},expected:{en:een,zh:ezh}});
const items=[
item("DC-00-01","00","Supported launch opens the app","受支持的启动方式可打开应用","The launcher or pnpm dev reaches a usable Daily Canvas page; direct index.html is not presented as supported.","启动器或 pnpm dev 能进入可用页面；不会把直接打开 index.html 描述为受支持方式。"),
item("DC-00-02","00","First run defaults to English","首次运行默认英文","A new origin starts in English and offers an immediate Chinese switch.","新来源默认英文，并可立即切换中文。"),
item("DC-00-03","00","Onboarding choice is respected","初始模板选择被尊重","Selected templates are created once; choosing no templates leaves an intentional empty state without duplicates after reload.","选中的模板只创建一次；不选模板会保留有意的空状态，刷新后不重复。"),
item("DC-00-04","00","Local-first boundary is understandable","本地优先边界易于理解","The interface explains local storage and backup risk without implying account, cloud sync, analytics, or remote AI.","界面解释本地存储与备份风险，不暗示账号、云同步、分析或远程 AI。"),
item("DC-01-01","01","Areas retain safe task relationships","领域安全保留任务关系","Create/edit/order/archive/restore work; deleting an Area leaves its tasks intact and unassigned.","创建、编辑、排序、归档和恢复有效；删除领域后任务仍保留并变为未分配。"),
item("DC-01-02","01","Fixed positive habit schedules are editable","固定正向习惯计划可编辑","Daily, selected-weekday, and interval choices save and produce the expected due dates and optional end boundary.","每日、指定星期和间隔选择可保存，并产生正确到期日和可选结束边界。"),
item("DC-01-03","01","Avoidance habit language is distinct","避免型习惯措辞明确区分","The type uses safe/lapse language; an unrecorded day is not silently counted as success.","该类型使用安全/失误措辞；未记录日不会被静默算作成功。"),
item("DC-01-04","01","Floating Task dates behave as availability and deadline","浮动任务日期体现可用与截止","Availability and optional deadline save; the item remains a flexible item rather than a daily missed obligation.","可用日期和可选截止日可保存；该项目保持为灵活任务而不是每日漏做义务。"),
item("DC-01-05","01","Quota Goal period and target save correctly","配额目标周期和次数保存正确","Weekly/monthly period, count target, availability, optional end, and milestone-period target survive edit and reload.","周/月周期、次数目标、可用日、可选结束日和里程碑周期目标在编辑和刷新后保留。"),
item("DC-01-06","01","Archive, restore, delete, star, and filters are predictable","归档、恢复、删除、加星与筛选可预测","Actions affect only the selected synthetic record; delete requires confirmation and filters never hide unrelated matching records.","操作只影响所选合成记录；删除需要确认，筛选不会隐藏其他符合条件的记录。"),
item("DC-02-01","02","Today shows only eligible active fixed records","今日只显示符合条件的活动固定记录","Due rules, start/end dates, lifecycle state, and pauses determine visibility without exposing archived/completed records as active work.","到期规则、起止日期、生命周期和暂停共同决定可见性，不把归档/已完成记录当作活动工作。"),
item("DC-02-02","02","Daily statuses update immediately and persist","每日状态即时更新并持久化","Done/safe/lapse/skipped toggles update visible state, statistics, and Calendar after reload without duplicate CheckIns.","完成/安全/失误/跳过会更新可见状态、统计和日历；刷新后保留且不生成重复打卡。"),
item("DC-02-03","02","Skipped days are statistically neutral","跳过日统计中立","Skipped scheduled days neither increase nor break streak and are excluded from completion-rate denominators.","跳过的计划日既不增加也不中断连续记录，并从完成率分母排除。"),
item("DC-02-04","02","Today reordering works by pointer and keyboard","今日排序支持指针与键盘","Both methods change the same order, announce or visibly expose focus, and persist for that date after reload.","两种方式改变同一顺序，焦点可见或有明确反馈，并在刷新后保留当日顺序。"),
item("DC-02-05","02","Optional experience prompt does not block completion","可选体验提示不阻塞完成","Check-in succeeds even if the Experience prompt is dismissed; saved experience remains separate evidence.","即使关闭体验提示，打卡也成功；保存的体验作为独立证据保留。"),
item("DC-03-01","03","Floating completion is recorded once","浮动完成只记录一次","Completing an available Floating Task removes the action, shows its completion date, and does not create fixed-task missed markers.","完成可用浮动任务后操作消失、显示完成日期，并且不产生固定任务的漏做标记。"),
item("DC-03-02","03","Floating overdue state is informative, not punitive","浮动逾期提示说明事实而非惩罚","An incomplete item after its deadline is visibly overdue but does not generate a streak failure or daily miss history.","截止后未完成会显示逾期，但不会产生连续失败或每日漏做历史。"),
item("DC-03-03","03","Quota credits accumulate in the correct period","配额计数在正确周期累计","Each done record contributes once to the selected week/month; progress and achieved-period outcome match the records.","每条完成记录在对应周/月只计一次；进度和已达成周期结果与记录一致。"),
item("DC-03-04","03","Quota Calendar filter is semantically isolated","日历配额筛选语义独立","Selecting Quota shows only quota-credit diamonds/details, never fixed-task checks or Floating completion markers.","选择配额后只显示配额菱形/详情，不显示固定任务勾选或浮动完成标记。"),
item("DC-04-01","04","Calendar states are readable without color alone","日历状态无需只靠颜色识别","Labels, shapes, counts, legend, and accessible names distinguish done, floating, quota, pause, skip, lapse, miss, Reflection, and Experience.","标签、形状、数量、图例与可访问名称区分完成、浮动、配额、暂停、跳过、失误、漏做、回顾和体验。"),
item("DC-04-02","04","Each record-type filter remains distinct","每种记录类型筛选保持独立","CheckIn, Floating, Quota, Reflection, and Experience filters expose only their own evidence; All restores the combined view.","打卡、浮动、配额、回顾和体验筛选只显示各自证据；全部恢复组合视图。"),
item("DC-04-03","04","Archived historical evidence remains inspectable","归档任务历史证据仍可检查","The archived sample is absent from normal active selectors but its June CheckIn and Experience remain selectable and visible in Calendar.","归档样本不出现在普通活动选择器中，但其 6 月打卡和体验仍可在日历中选择和查看。"),
item("DC-04-04","04","Paused and completed lifecycle history remains inspectable","暂停和已完成生命周期历史仍可检查","Lifecycle inactivity does not erase supporting Calendar dates, pause evidence, reflections, or review-linked dates.","生命周期非活动状态不会抹去支持性日历日期、暂停证据、回顾或回顾链接日期。"),
item("DC-04-05","04","Past check-ins can be corrected safely","过去打卡可安全更正","Editing a past applicable date changes exactly one CheckIn and all derived views update consistently; future dates remain protected.","编辑适用的过去日期只改变一条打卡，所有派生页面一致更新；未来日期仍受保护。"),
item("DC-04-06","04","Calendar keyboard movement and detail view stay synchronized","日历键盘移动与详情同步","Arrow-key navigation moves predictably and the selected date's supporting records match the cell evidence and current filters.","方向键导航可预测，所选日期支持记录与格子证据及当前筛选一致。"),
item("DC-05-01","05","Review ranges use inclusive, valid dates","回顾范围使用包含式有效日期","Preset and custom ranges include both endpoints; reversed ranges are rejected visibly without producing misleading results.","预设和自定义范围包含两个端点；反向范围会明显拒绝且不产生误导结果。"),
item("DC-05-02","05","Review counts and filters match Calendar evidence","回顾数量与筛选匹配日历证据","Fixed, Floating, Quota, Area, and schedule counts equal source records for the same inclusive range and filters.","固定、浮动、配额、领域和计划数量与相同包含范围及筛选下的来源记录一致。"),
item("DC-05-03","05","Review language stays factual and non-diagnostic","回顾措辞保持事实性且不诊断","English and Chinese describe recorded facts without causal claims, coaching, shame, prescriptions, or false certainty.","中英文只描述已记录事实，不作因果判断、指导、羞辱、处方或虚假确定性表达。"),
item("DC-05-04","05","Review claims link to inspectable Calendar dates","回顾结论可链接到可检查日历日期","Opening each listed date reaches non-empty supporting Calendar evidence even for archived, paused, or completed records.","打开每个列出日期都能到达非空日历证据，包括归档、暂停或已完成记录。"),
item("DC-06-01","06","Reflection preserves emotions, paragraphs, and exact authorship","回顾保留情绪、多段文字与原始表达","One Reflection per date saves selected emotions and unrestricted paragraphs, reopens for editing, and does not duplicate the date.","每天一篇回顾保存所选情绪和不受限多段文字，可重新编辑且不重复日期。"),
item("DC-06-02","06","Optional prompts can rotate, skip, and disable","可选提示可轮换、跳过与关闭","Skipping does not erase writing; disabling prompts removes them without affecting existing Reflections.","跳过不会清除文字；关闭提示后提示消失，但不影响已有回顾。"),
item("DC-06-03","06","Custom emotion lifecycle preserves past meaning","自定义情绪生命周期保留历史含义","Create/edit/archive behavior is understandable and past Reflection evidence remains legible after the emotion is no longer active.","自定义情绪的创建、编辑和归档行为易理解；情绪不再活动后，过去回顾证据仍可理解。"),
item("DC-06-04","06","Experience Logs remain separate and optional","体验记录保持独立且可选","Saving or dismissing an Experience Log never changes CheckIn success; saved comparison/note appears in Calendar and Review context.","保存或关闭体验记录都不改变打卡成功；保存的对比/备注出现在日历和回顾背景中。"),
item("DC-06-05","06","Background slots remain local and controllable","背景槽位保持本地且可控","Supported image import, slot choice, fit, position, overlay, blur, replace, clear, reload, and backup behave as explained without upload.","支持的图片导入、槽位、适配、位置、遮罩、模糊、替换、清除、刷新与备份行为符合说明且不上传。"),
item("DC-07-01","07","Reached milestone celebrates once before choice","达到里程碑只在选择前庆祝一次","The threshold opens one restrained celebration and presents continue, maintenance, extend, complete, or archive without punitive language.","阈值触发一次克制庆祝，并提供继续、维护、延长、完成或归档，不使用惩罚措辞。"),
item("DC-07-02","07","Continue advances the next durable threshold","继续会持久提高下一个阈值","After Continue, the next ordinary completion does not reopen the acknowledged milestone; a genuinely later threshold can still celebrate.","选择继续后，下一次普通完成不会重开已确认里程碑；真正更高阈值仍可庆祝。"),
item("DC-07-03","07","Planned pause freezes rather than rewrites history","计划暂停冻结而非重写历史","Pause dates count as neither complete nor failed, current streak freezes, and personal best, totals, and milestone history remain.","暂停日既不算完成也不算失败，当前连续记录冻结，历史最佳、总完成和里程碑保留。"),
item("DC-07-04","07","Retroactive pause cannot repair an earlier miss","事后暂停不能修复更早漏做","The effective pause begins no earlier than its creation evidence and does not retroactively restore an already broken streak.","有效暂停不会早于创建证据，也不会倒过来恢复已经中断的连续记录。"),
item("DC-07-05","07","Manual Resume closes effective pause safely","手动恢复安全结束有效暂停","Open-ended and future-ended pauses stop affecting Today and statistics on resume date; original PausePeriod and resumed event remain inspectable.","无结束日和未来结束日暂停在恢复当天不再影响今日与统计；原暂停记录和恢复事件仍可检查。"),
item("DC-07-06","07","Interruption recovery preserves perspective and choice","中断恢复保留历史视角与选择","Current streak may factually stop, while totals, personal best, and past milestones remain visible with Continue, Adjust, and Pause choices.","当前连续记录可按事实中断，同时显示总完成、历史最佳和过往里程碑，并提供继续、调整和暂停。"),
item("DC-07-07","07","Rewards unlock, claim, and delete predictably","奖励解锁、领取与删除可预测","Date and streak rewards unlock only from eligible facts, claim once, retain claimed state, and delete only after confirmation.","日期和连续奖励只根据符合条件的事实解锁，只能领取一次、保留已领取状态，并仅在确认后删除。"),
item("DC-08-01","08","Meditation creation enforces one mixed-language limit","感悟创建执行统一混合语言限制","Empty and over-150-unit content is blocked; Han characters, other-language words, punctuation, and line breaks follow the displayed rule.","空内容和超过 150 单位内容被阻止；汉字、其他语言单词、标点和换行遵循显示规则。"),
item("DC-08-02","08","Meditation edit preserves original creation time","编辑感悟保留原创建时间","Editing content changes the edited state/time while the original creation date remains the collection and export date.","编辑内容会更新编辑状态/时间，但原创建日期仍作为合集与导出日期。"),
item("DC-08-03","08","Meditation order is persistent and shared by exports","感悟顺序持久且被导出共享","Pointer and keyboard reorder persist after reload and the same order appears in all/selected preview and Word output.","指针和键盘排序刷新后保留，全部/部分预览和 Word 使用同一顺序。"),
item("DC-08-04","08","Selection and deletion stay scoped","选择与删除保持范围明确","Export Selected contains only checked entries; cancelling selection clears temporary selection; confirmed deletion affects only one entry.","导出所选只含勾选条目；取消选择会清除临时选择；确认删除只影响一条。"),
item("DC-08-05","08","Cover, date, style, and text controls update preview","封面、日期、样式与字号控件更新预览","Both cover titles are editable, dates can be hidden, five backgrounds and three text sizes update the visible preview.","中英文封面可编辑，日期可隐藏，五种背景和三种字号会更新可见预览。"),
item("DC-08-06","08","A4 and Letter control the actual print rule","A4 与 Letter 控制实际打印规则","The selected option changes the document @page rule to A4 or Letter and the print surface reflects that choice where the browser exposes it.","所选选项把文档 @page 规则改为 A4 或 Letter；浏览器可显示时，打印界面反映该选择。"),
item("DC-08-07","08","Word export is local, ordered, and editable","Word 导出保持本地、有序且可编辑","The .docx downloads without upload, opens as editable text, preserves selected entries/order and chosen cover/page settings without exposing hidden dates.","`.docx` 不上传即可下载，以可编辑文字打开，保留所选条目/顺序及封面/页面设置，不泄露已隐藏日期。"),
item("DC-09-01","09","Current backup export is complete and readable","当前备份导出完整可读","The v6 JSON downloads and contains expected synthetic collections, settings, lifecycle evidence, backgrounds, and Meditations without unrelated browser data.","v6 JSON 下载后包含预期合成集合、设置、生命周期证据、背景和感悟，不包含无关浏览器数据。"),
item("DC-09-02","09","Restore preview is explicit and cancellable","恢复预览明确且可取消","Counts and migration status are shown before replacement; Cancel leaves current data unchanged.","替换前显示数量与迁移状态；取消不会改变当前数据。"),
item("DC-09-03","09","Restore creates a safety backup before replacement","恢复在替换前创建安全备份","Confirm Restore downloads a safety backup before replacing data and finishes with collection counts matching the preview.","确认恢复会先下载安全备份再替换数据，完成后集合数量与预览一致。"),
item("DC-09-04","09","Normal v6 sample restores cross-module evidence","正常 v6 样本恢复跨模块证据","Tasks, history, pause, Reflection, Experience, rewards, and ordered Meditations appear in their corresponding views after restore and reload.","恢复并刷新后，任务、历史、暂停、回顾、体验、奖励和有序感悟出现在对应页面。"),
item("DC-09-05","09","Supported v5 sample migrates additively","受支持 v5 样本进行增量迁移","Preview identifies v5 migration; existing v5 records survive and Meditations begins empty under v6 without invented content.","预览标识 v5 迁移；已有 v5 记录保留，v6 感悟为空且不会编造内容。"),
item("DC-09-06","09","Invalid and future backups are rejected safely","无效及未来备份被安全拒绝","Duplicate Meditation order and version 99 are rejected before restore; the database visible before each attempt remains unchanged.","重复感悟顺序和版本 99 在恢复前被拒绝；每次尝试前可见数据库保持不变。"),
item("DC-10-01","10","English and Chinese interfaces are complete and usable","中英文界面完整可用","All top-level views, dialogs, actions, errors, and export controls switch without mixed missing-key text or meaning changes.","所有顶层页面、对话框、操作、错误和导出控件切换后不会出现缺失键混杂文字或含义变化。"),
item("DC-10-02","10","Keyboard and focus behavior support core workflows","键盘与焦点支持核心流程","Navigation, dialogs, forms, Calendar, Today reorder, Meditation reorder, and confirmations can be completed with visible logical focus.","导航、对话框、表单、日历、今日排序、感悟排序和确认可用键盘完成，焦点可见且顺序合理。"),
item("DC-10-03","10","Narrow layouts preserve controls and content","窄屏布局保留控件与内容","At phone-like width, no essential action, status, evidence, or writing content becomes unreachable or overlaps destructively.","在手机式宽度下，关键操作、状态、证据和书写内容都可触达且不会破坏性重叠。"),
item("DC-10-04","10","Theme and reduced-motion choices persist","主题与减少动效选择可持久化","Light/dark/system and reduced-motion settings update visibly, retain legible contrast, and survive reload.","浅色/深色/系统主题与减少动效会明显更新、保持可读对比度并在刷新后保留。"),
item("DC-10-05","10","No remote dependency is required during normal use","正常使用不需要远程依赖","After the app has loaded locally, offline use of core records, Calendar, Reflection, backup, and questionnaire produces no required network request.","应用本地加载后，离线使用核心记录、日历、回顾、备份与问卷不产生必需网络请求。"),
item("DC-10-06","10","Private content stays within the chosen local/export boundary","私人内容保持在所选本地/导出边界","No account, telemetry, analytics, remote font, secret, absolute path, or unrelated storage content appears in UI exports or QA artifacts.","界面导出和 QA 资产中不出现账号、遥测、分析、远程字体、Secret、绝对路径或无关存储内容。"),
item("DC-11-01","11","Sustained cross-view use remains coherent","持续跨页面使用保持一致","A mixed session of creation, check-in, correction, Reflection, Review, lifecycle, Meditation, export, and reload keeps consistent state without visible errors.","持续执行创建、打卡、更正、回顾、周期回顾、生命周期、感悟、导出和刷新后，状态一致且无可见错误。"),
item("DC-11-02","11","Observed performance is acceptable at representative scale","代表性规模下性能可接受","The normal sample plus additional synthetic history keeps navigation, month changes, Review filters, reorder, and export responsive enough for ordinary personal use; any delay is recorded.","正常样本加额外合成历史后，导航、切月、回顾筛选、排序和导出对普通个人使用仍足够响应；任何延迟均被记录。")
];
const statuses=["not-tested","pass","fail","blocked","not-applicable"],severities=["","low","medium","high","critical"];
let state={schemaVersion:SCHEMA,project:PROJECT,questionnaireVersion:VERSION,language:"en",savedAt:null,meta:{appVersion:"",reviewDate:new Date().toISOString().slice(0,10),testerCode:"",environment:""},answers:{},overall:{mostMature:"",mostConfusing:"",mostEffort:"",trustIssues:"",topThree:"",releaseBlockers:"",releaseDecision:"",otherFeedback:""}};
function text(v){return typeof v==="string"?v:v[state.language]}
function t(key,vars={}){let out=ui[state.language][key]||key;Object.entries(vars).forEach(([k,v])=>out=out.replace(`{{${k}}}`,String(v)));return out}
function answer(id){return state.answers[id]||(state.answers[id]={status:"not-tested",severity:"",actual:"",repro:"",evidence:"",suggestion:""})}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 document.documentElement.lang=state.language==="zh"?"zh-CN":"en";
 document.querySelectorAll("[data-t]").forEach(el=>{const key=el.dataset.t;el.textContent=t(key)});
 document.getElementById("langEn").classList.toggle("active",state.language==="en");document.getElementById("langZh").classList.toggle("active",state.language==="zh");
 document.querySelectorAll("[data-meta]").forEach(el=>el.value=state.meta[el.dataset.meta]||"");
 document.querySelectorAll("[data-overall]").forEach(el=>el.value=state.overall[el.dataset.overall]||"");
 const nav=document.getElementById("nav"),root=document.getElementById("modules");nav.innerHTML="";root.innerHTML="";
 modules.forEach(mod=>{
   const modItems=items.filter(i=>i.module===mod.id),done=modItems.filter(i=>answer(i.id).status!=="not-tested").length;
   const a=document.createElement("a");a.href=`#module-${mod.id}`;a.innerHTML=`<span>${mod.id} ${escapeHtml(text({en:mod.en,zh:mod.zh}))}</span><small>${done}/${modItems.length}</small>`;nav.appendChild(a);
   const section=document.createElement("section");section.className="module";section.id=`module-${mod.id}`;
   section.innerHTML=`<div class="module-head"><div><span class="kicker">${mod.id}</span><h2>${escapeHtml(text({en:mod.en,zh:mod.zh}))}</h2><p>${escapeHtml(text(mod.purpose))}</p></div><span class="module-badge">${t("moduleCount",{done,total:modItems.length})}</span></div>
   <div class="module-guide"><div><h3>${t("prerequisites")}</h3><p>${escapeHtml(text(mod.pre))}</p></div><div><h3>${t("samples")}</h3><p>${escapeHtml(text(mod.samples))}</p></div><div><h3>${t("steps")}</h3><ol>${text(mod.steps).map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ol></div></div>`;
   modItems.forEach(it=>section.appendChild(renderItem(it)));root.appendChild(section);
 });
 updateStats();updateSaveState();
}
function renderItem(it){
 const a=answer(it.id),wrap=document.createElement("article");wrap.className="check";wrap.dataset.item=it.id;
 wrap.innerHTML=`<div class="check-title"><span class="check-id">${it.id}</span><h3>${escapeHtml(text(it.title))}</h3></div>
 <div class="expected"><strong>${t("expected")}</strong>${escapeHtml(text(it.expected))}</div>
 <fieldset class="status-row"><legend class="sr-only">${t("severity")}</legend>${statuses.map(s=>`<label><input type="radio" name="status-${it.id}" value="${s}" ${a.status===s?"checked":""}><span>${t({["not-tested"]:"notTested",pass:"pass",fail:"fail",blocked:"blocked",["not-applicable"]:"notApplicable"}[s])}</span></label>`).join("")}</fieldset>
 <label class="field severity"><span>${t("severity")}</span><select data-field="severity">${severities.map(s=>`<option value="${s}" ${a.severity===s?"selected":""}>${s?t(s):t("none")}</option>`).join("")}</select></label>
 <div class="details-grid">
 <label class="field"><span>${t("actual")}</span><textarea data-field="actual">${escapeHtml(a.actual)}</textarea></label>
 <label class="field"><span>${t("repro")}</span><textarea data-field="repro">${escapeHtml(a.repro)}</textarea></label>
 <label class="field"><span>${t("evidence")}</span><textarea data-field="evidence">${escapeHtml(a.evidence)}</textarea></label>
 <label class="field"><span>${t("suggestion")}</span><textarea data-field="suggestion">${escapeHtml(a.suggestion)}</textarea></label></div>`;
 wrap.querySelectorAll(`input[name="status-${it.id}"]`).forEach(el=>el.addEventListener("change",()=>{a.status=el.value;changed()}));
 wrap.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("input",()=>{a[el.dataset.field]=el.value;changed()}));return wrap;
}
let saveTimer;
function changed(){document.getElementById("saveState").textContent=t("saving");clearTimeout(saveTimer);saveTimer=setTimeout(save,250);updateStats()}
function save(){state.savedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateSaveState()}catch{const el=document.getElementById("saveState");el.textContent=t("storageError");el.classList.add("error")}}
function updateSaveState(){const el=document.getElementById("saveState");el.classList.remove("error");el.textContent=state.savedAt?`${t("saved")} · ${new Date(state.savedAt).toLocaleTimeString()}`:t("notSaved")}
function updateStats(){const counts=Object.fromEntries(statuses.map(s=>[s,items.filter(i=>answer(i.id).status===s).length]));const reviewed=items.length-counts["not-tested"],pct=Math.round(reviewed/items.length*100);document.getElementById("sidePercent").textContent=`${pct}%`;document.getElementById("sideBar").style.width=`${pct}%`;const defs=[["completion",`${reviewed}/${items.length}`],["pass",counts.pass],["fail",counts.fail],["blocked",counts.blocked],["notTested",counts["not-tested"]],["notApplicable",counts["not-applicable"]]];document.getElementById("stats").innerHTML=defs.map(([k,v])=>`<div class="stat"><strong>${v}</strong><small>${t(k)}</small></div>`).join("")}
function payload(){return {...state,exportedAt:new Date().toISOString(),checklistDefinition:items.map(i=>({id:i.id,module:i.module,title:i.title,expected:i.expected}))}}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t("downloaded"))}
function exportJson(){download(`daily-canvas-manual-qa-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(payload(),null,2),"application/json")}
function mdEscape(s){return String(s||"").replace(/\|/g,"\\|")}
function exportMarkdown(){
 let out=`# Daily Canvas Full-Product Manual QA\n\n- Questionnaire: ${VERSION}\n- Schema: ${SCHEMA}\n- Application: ${state.meta.appVersion||"Not recorded"}\n- Date: ${state.meta.reviewDate||"Not recorded"}\n- Tester code: ${state.meta.testerCode||"Not recorded"}\n- Environment: ${state.meta.environment||"Not recorded"}\n\n`;
 modules.forEach(mod=>{out+=`## ${mod.id} ${text({en:mod.en,zh:mod.zh})}\n\n`;items.filter(i=>i.module===mod.id).forEach(i=>{const a=answer(i.id);out+=`### ${i.id} ${text(i.title)}\n\n- Status: ${a.status}\n- Severity: ${a.severity||"none"}\n- Expected: ${text(i.expected)}\n- Actual: ${a.actual||""}\n- Reproduction: ${a.repro||""}\n- Evidence: ${a.evidence||""}\n- Suggestion: ${a.suggestion||""}\n\n`})});
 out+=`## Overall evaluation\n\n${Object.entries(state.overall).map(([k,v])=>`- ${k}: ${mdEscape(v)}`).join("\n")}\n`;download(`daily-canvas-manual-qa-${new Date().toISOString().slice(0,10)}.md`,out,"text/markdown")}
function validateImport(v){if(!v||typeof v!=="object"||v.project!==PROJECT||v.schemaVersion!==SCHEMA||typeof v.answers!=="object"||!v.meta||typeof v.meta!=="object"||!v.overall||typeof v.overall!=="object")throw new Error("identity/schema");for(const [id,a] of Object.entries(v.answers)){if(!items.some(i=>i.id===id))continue;if(!a||typeof a!=="object"||!statuses.includes(a.status))throw new Error("answer");for(const f of ["severity","actual","repro","evidence","suggestion"])if(typeof (a[f]??"")!=="string")throw new Error("field")}return true}
function importJson(file){const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(String(reader.result));validateImport(v);state={...state,...v,language:v.language==="zh"?"zh":"en",meta:{...state.meta,...v.meta},overall:{...state.overall,...v.overall},answers:v.answers,savedAt:new Date().toISOString()};save();render();toast(t("importOk"))}catch{toast(t("importBad"))}};reader.readAsText(file)}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2600)}
function autosizeTextareas(){document.querySelectorAll("textarea").forEach(el=>{el.style.height="auto";if(el.value)el.style.height=`${Math.max(82,el.scrollHeight)}px`})}
function bind(){
 document.getElementById("langEn").onclick=()=>{state.language="en";save();render()};document.getElementById("langZh").onclick=()=>{state.language="zh";save();render()};
 document.querySelectorAll("[data-meta]").forEach(el=>el.addEventListener("input",()=>{state.meta[el.dataset.meta]=el.value;changed()}));
 document.querySelectorAll("[data-overall]").forEach(el=>el.addEventListener("input",()=>{state.overall[el.dataset.overall]=el.value;changed()}));
 document.getElementById("exportJson").onclick=exportJson;document.getElementById("exportMd").onclick=exportMarkdown;document.getElementById("print").onclick=()=>print();
 document.getElementById("importJson").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value=""};
 document.getElementById("reset").onclick=()=>{if(confirm(t("resetOne"))&&confirm(t("resetTwo"))){localStorage.removeItem(STORAGE_KEY);state={schemaVersion:SCHEMA,project:PROJECT,questionnaireVersion:VERSION,language:state.language,savedAt:null,meta:{appVersion:"",reviewDate:new Date().toISOString().slice(0,10),testerCode:"",environment:""},answers:{},overall:{mostMature:"",mostConfusing:"",mostEffort:"",trustIssues:"",topThree:"",releaseBlockers:"",releaseDecision:"",otherFeedback:""}};render();bind();toast(t("resetDone"))}};
 document.addEventListener("input",event=>{if(event.target instanceof HTMLTextAreaElement){event.target.style.height="auto";event.target.style.height=`${Math.max(82,event.target.scrollHeight)}px`}});
 addEventListener("beforeprint",autosizeTextareas);
}
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(stored){validateImport(stored);state={...state,...stored,meta:{...state.meta,...stored.meta},overall:{...state.overall,...stored.overall}}}}catch{}
render();bind();autosizeTextareas();
</script>
</body>
</html>
